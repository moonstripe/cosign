[project]
name = "steer"
version = "0.1.0"
description = "Per-token steerable co-writing with LFM3-1.7B"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "modal>=1.6.4",
    "python-dotenv>=1.2.4",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "transformers>=5.12",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cosign = "steer.cli:main"
cosign-web = "steer.server:main"
# legacy names, kept so old commands still work
cowrite = "steer.cli:main"
cowrite-web = "steer.server:main"
wsp-lab = "steer.wsp.lab:main"
wsp = "steer.wsp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steer"]
